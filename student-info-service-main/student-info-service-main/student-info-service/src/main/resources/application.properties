spring.application.name=student-info-service
server.port=8091

spring.datasource.url=jdbc:mysql://localhost:3306/school_hub
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# BUG-010: other services, checked before a student is permanently deleted
payment.service.url=http://localhost:8092
transport.service.url=http://localhost:8093
notification.service.url=http://localhost:8094
